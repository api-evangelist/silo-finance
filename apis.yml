aid: silo-finance
name: Silo Finance
description: 'Silo Finance is a decentralized, non-custodial lending protocol built
  around isolated money markets. Each market pairs a single collateral asset with a
  borrowable asset in its own risk silo, so the failure or manipulation of one asset
  cannot cascade into unrelated markets — the isolation model that distinguishes Silo
  from pooled lenders. The protocol is delivered as onchain smart contracts (Silo V1,
  V2 and V3) deployed across Ethereum and other EVM chains, with an application at
  silo.finance, developer and protocol-architecture documentation at docs.silo.finance,
  third-party security audits, and an open GitHub organization publishing the contracts,
  subgraph and indexer. Silo Finance is backed by Electric Capital and is tracked in
  the API Evangelist network as a DeFi lending provider.'
